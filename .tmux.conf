# Ctrl-[HJKL]: Switch panes
bind h select-pane -L
bind l select-pane -R
bind j select-pane -D
bind k select-pane -U

# vi bindings
set-window-option -g mode-keys vi

#### COLOUR (Solarized dark)
# NOTE: tmux 2.9 removed the separate -fg/-bg/-attr options in favour of
# combined *-style options. Keep this file in the *-style syntax.

# default statusbar colors
set-option -g status-style bg=black,fg=yellow          #base02 / yellow

# default window title colors
set-window-option -g window-status-style fg=brightblue,bg=default        #base0

# active window title colors
set-window-option -g window-status-current-style fg=brightred,bg=default #orange

# pane border
set-option -g pane-border-style fg=black               #base02
set-option -g pane-active-border-style fg=brightgreen  #base01

# message text
set-option -g message-style bg=black,fg=brightred      #base02 / orange

# pane number display
set-option -g display-panes-active-colour blue #blue
set-option -g display-panes-colour brightred #orange

# clock
set-window-option -g clock-mode-colour green #green

# session list ordering by name
bind s choose-tree -sZ -O name

# hyperlinks passthrough (ghostty reports xterm-ghostty locally,
# often xterm-256color over ssh -- cover both)
set -as terminal-features ",xterm*:hyperlinks"
